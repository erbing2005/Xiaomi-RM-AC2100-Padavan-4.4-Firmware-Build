name: Build-padavan-firmware

on:
  workflow_dispatch:
  
  schedule:
   - cron: 0 0 * * 5
  
  watch:
    types: [started]

env:
  src_git: https://github.com/MeIsReallyBa/padavan-4.4.git
  src_dir: /opt/padavan
  work_dir: /opt/padavan/trunk
  firmware_dir: /opt/firmware
  config_file: config
  custom_script: custom.sh
  lang_dir: lang
  
jobs:
  build:
    name: build
    runs-on: ubuntu-20.04  # 使用固定版本確保編譯環境穩定，與上游倉庫保持一致
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      matrix:
        device: [RM2100]
    permissions: 
      contents: write

    steps:
    # 檢出代碼
    - name: Checkout
      uses: actions/checkout@v4

    # 安裝編譯所需的依賴包
    - name: Install dependencies
      if: (!cancelled())
      run: |
        sudo apt-get -qq install -y \
          unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
          fakeroot kmod cpio git python3-docutils gettext automake autopoint \
          texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin &
          wait
          sudo timedatectl set-timezone "Asia/Taipei"

    # 克隆源碼並下載工具鏈
    - name: Clone source and Download toolchain
      if: (!cancelled())
      run: |
        git clone --depth=1 $src_git $src_dir
        cd $src_dir/toolchain-mipsel && chmod +x dl_toolchain.sh
        ./dl_toolchain.sh

    #- name: Import language configs
      #if: (!cancelled())
      #run: |
        #cp -rf $lang_dir/* $work_dir/user/www
      
    # 導入自定義配置文件，custom.sh 為可選
    - name: Import Custom configs
      if: (!cancelled())
      run: |
        cp $config_file $work_dir/configs/templates/${{ matrix.device }}.config
        cp $config_file $work_dir/.config
        if [ -f "$custom_script" ]; then
          cp $custom_script $work_dir/
          cd $work_dir
          chmod +x build_firmware_modify && chmod +x $custom_script
          ./$custom_script
        else
          cd $work_dir
          chmod +x build_firmware_modify
        fi

    # 編譯固件
    - name: Compile the firmware
      if: (!cancelled())
      id: compile
      run: |
        cd $work_dir
        fakeroot ./build_firmware_modify ${{ matrix.device }} 0
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        mkdir -p $firmware_dir
        if ls images/*.trx 1> /dev/null 2>&1; then
          cp images/*.trx $firmware_dir
        else
          echo "Error: No firmware files found"
          exit 1
        fi

    # 上傳固件到 Artifact
    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: ${{ success() }} && !cancelled()
      with:
        name: ${{ matrix.device }}
        path: ${{ env.firmware_dir }}
        if-no-files-found: error
        

    # 上傳固件到 Release
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      env:
       GITHUB_TOKEN: ${{ github.token }}
      with:
       files: |
         ${{ env.firmware_dir }}/*.trx
       tag_name: ${{ steps.compile.outputs.release_tag }}
